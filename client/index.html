<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobvana</title>
    <script>
      // Applied before React mounts (and before first paint) so there's no
      // flash of the wrong theme - falls back to OS preference (handled by
      // the @media query in index.css) when nothing's saved yet.
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
