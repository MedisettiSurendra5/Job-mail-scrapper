# jobvana.in - fronted by a Cloudflare Tunnel (cloudflared -> localhost:4001).
# The Express app on :4000 serves BOTH the API and the built React SPA, so
# everything is proxied there. Do not add a `root` here: serving the SPA off
# disk meant frontend deploys silently never landed.
server {
    listen 4001;
    server_name jobvana.in www.jobvana.in;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The public endpoint is always HTTPS (Cloudflare). The app uses this
        # to build the Google OAuth redirect_uri, which must be https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # JobRight automation runs can take well over a minute.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }
}
