services:
  app:
    build: .
    network_mode: host
    shm_size: "1gb"

    env_file:
      - .env

    environment:
      DATA_DIR: /app/data
      DATABASE_URL: "file:/app/data/app.db"
      HEADLESS: "true"
      NODE_ENV: production

    # Deliberately OUTSIDE the git checkout. When this pointed at
    # <checkout>/data the running app kept the working tree dirty and
    # `git pull` on the NAS aborted, so deploys stopped landing.
    # See DEPLOY.md > "Migrating the data directory" for the one-time move.
    volumes:
      - /volume1/docker/jobvana-data:/app/data

    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host

    command: tunnel run

    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

    depends_on:
      - app

    restart: unless-stopped
